name: Build Xash-RT RayTracing

on:
  workflow_dispatch:
    inputs:
      rtgl1_run_id:
        description: 'RayTracedGL1 workflow run ID (optional)'
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule update --init --remote 3rdparty/mainui
          git -C 3rdparty/mainui submodule update --init --recursive
          $otherSubs = git config --file .gitmodules --get-regexp '\.path$' | ForEach-Object { ($_ -split ' ')[1] } | Where-Object { $_ -ne '3rdparty/mainui' }
          git submodule update --init --recursive $otherSubs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch RTGL1 Artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          $targetRepo = "boofiboi/RayTracedGL1"
          $targetBranch = "hl1"
          $targetRunId = "${{ inputs.rtgl1_run_id }}".Trim()

          if (-not $targetRunId) {
            $latestSha = (gh api "repos/$targetRepo/commits/$targetBranch" --jq '.sha' 2>$null)

            $maxWaitSec = 600
            $startTime = Get-Date

            while (((Get-Date) - $startTime).TotalSeconds -lt $maxWaitSec) {
              $runJson = (gh run list --repo $targetRepo --branch $targetBranch --limit 1 --json databaseId,headSha,status,conclusion 2>$null)
              if ($runJson) {
                $latestRun = ($runJson | ConvertFrom-Json)[0]
                if ($latestRun) {
                  if ($latestSha -and $latestRun.headSha -ne $latestSha) {
                    Start-Sleep -Seconds 10
                    continue
                  }

                  if ($latestRun.status -ne "completed") {
                    gh run watch $($latestRun.databaseId) --repo $targetRepo --exit-status
                    $targetRunId = $latestRun.databaseId
                    break
                  } else {
                    if ($latestRun.conclusion -eq "success") {
                      $targetRunId = $latestRun.databaseId
                    }
                    break
                  }
                }
              }
              Start-Sleep -Seconds 10
            }
          }

          if ($targetRunId) {
            gh run download $targetRunId --repo $targetRepo --name RayTracedGL1-Artifact --dir rtgl1_sdk 2>$null
          } else {
            gh run download --repo $targetRepo --name RayTracedGL1-Artifact --dir rtgl1_sdk 2>$null
          }

          $LASTEXITCODE = 0
          if (Test-Path "rtgl1_sdk/Build/x64-Release/Release/RayTracedGL1.lib") {
            echo "RTGL1_SDK_PATH=$((Get-Item rtgl1_sdk).FullName)" >> $env:GITHUB_ENV
          } else {
            Write-Host "Prebuilt RTGL1 artifact not found; WAF will pull and compile RTGL1 automatically."
          }

      - name: Configure xash-rt
        shell: pwsh
        run: |
          python waf configure --enable-raytracing -8 --enable-lto --enable-poly-opt --disable-menu-changegame -T Release

      - name: Build xash-rt
        shell: pwsh
        run: |
          python waf build

      - name: Assemble Release Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "package/rt_bin"
          New-Item -ItemType Directory -Force -Path "package/rt/shaders"

          Copy-Item -Path "build/ref/gl/ref_gl.dll" -Destination "package/rt_bin/ref_gl.dll" -Force
          Copy-Item -Path "build/engine/xash.dll" -Destination "package/rt_bin/xash.dll" -Force
          Copy-Item -Path "build/game_launch/xash3d.exe" -Destination "package/rt_bin/xash3d.exe" -Force
          Copy-Item -Path "build/filesystem/filesystem_stdio.dll" -Destination "package/rt_bin/filesystem_stdio.dll" -Force
          Copy-Item -Path "build/3rdparty/mainui/menu.dll" -Destination "package/rt_bin/menu.dll" -Force
          Copy-Item -Path "SDL2_VC/lib/x64/SDL2.dll" -Destination "package/rt_bin/SDL2.dll" -Force

          if (Test-Path "build/3rdparty/freevgui/vgui.dll") {
            Copy-Item -Path "build/3rdparty/freevgui/vgui.dll" -Destination "package/rt_bin/vgui.dll" -Force
          }

          if (Test-Path "build/3rdparty/vgui_support/vgui_support.dll") {
            Copy-Item -Path "build/3rdparty/vgui_support/vgui_support.dll" -Destination "package/rt_bin/vgui_support.dll" -Force
          } elseif (Test-Path "build/3rdparty/freevgui/vgui.dll") {
            Copy-Item -Path "build/3rdparty/freevgui/vgui.dll" -Destination "package/rt_bin/vgui_support.dll" -Force
          }

          $rtgl1Dir = $env:RTGL1_SDK_PATH
          if (-not $rtgl1Dir -or -not (Test-Path $rtgl1Dir)) {
            if (Test-Path "rtgl1_sdk") {
              $rtgl1Dir = (Get-Item "rtgl1_sdk").FullName
            } elseif (Test-Path "../RayTracedGL1") {
              $rtgl1Dir = (Get-Item "../RayTracedGL1").FullName
            }
          }

          Copy-Item -Path "$rtgl1Dir/Build/x64-Release/Release/RayTracedGL1.dll" -Destination "package/rt_bin/RayTracedGL1.dll" -Force
          Copy-Item -Path "$rtgl1Dir/Build/x64-Release/Release/NRI.dll" -Destination "package/rt_bin/NRI.dll" -Force
          Copy-Item -Path "$rtgl1Dir/bin/amd_fidelityfx_vk.dll" -Destination "package/rt_bin/amd_fidelityfx_vk.dll" -Force
          if (Test-Path "$rtgl1Dir/bin/nvngx_*.dll") {
            Copy-Item -Path "$rtgl1Dir/bin/nvngx_*.dll" -Destination "package/rt_bin/" -Force
          } elseif (Test-Path "$rtgl1Dir/Build/x64-Release/Release/nvngx_*.dll") {
            Copy-Item -Path "$rtgl1Dir/Build/x64-Release/Release/nvngx_*.dll" -Destination "package/rt_bin/" -Force
          } elseif (Test-Path "$rtgl1Dir/Source/External/DLSS/lib/Windows_x86_64/rel/nvngx_*.dll") {
            Copy-Item -Path "$rtgl1Dir/Source/External/DLSS/lib/Windows_x86_64/rel/nvngx_*.dll" -Destination "package/rt_bin/" -Force
          }
          Copy-Item -Path "$rtgl1Dir/Build/shaders/*.spv" -Destination "package/rt/shaders/" -Force

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xash-rt-windows-x64
          path: package/
